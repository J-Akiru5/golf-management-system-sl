services:
  - type: web
    name: igcc-scorecard-reader
    runtime: docker
    plan: starter
    region: singapore
    branch: develop
    autoDeploy: true
    dockerfilePath: ./scripts/scan/Dockerfile
    dockerContext: ./scripts/scan
    healthCheckPath: /health
    envVars:
      # The card reader runs its own ONNX model. No hosted inference at run time.
      - key: SCAN_MODEL_BACKEND
        value: local_onnx
      - key: SCAN_MODEL_PATH
        value: /app/models/igcc-scorecard-digits.onnx
      - key: SCAN_MODEL_CLASSES
        value: /app/models/classes.json
      - key: SCAN_CARD_TEMPLATE
        value: /app/models/igcc-card-template.npz
      - key: SCAN_CARD_MODE
        value: auto
      - key: SCAN_CONFIDENCE_THRESHOLD
        value: "0.60"
      - key: SCAN_CLASSIFY_CONCURRENCY
        value: "3"
      - key: SCAN_MAX_UPLOAD_BYTES
        value: "15728640"
      # Render generates the bearer token. Copy the same value to Vercel as
      # SCAN_INFERENCE_TOKEN after the first deploy.
      - key: SCAN_INFERENCE_TOKEN
        generateValue: true
      # The weights are not in Git. Upload the .onnx to a private bucket and set
      # these three in the Render dashboard. SCAN_MODEL_SHA256 is required
      # whenever SCAN_MODEL_URL is set; an unverified file is never loaded.
      - key: SCAN_MODEL_URL
        sync: false
      - key: SCAN_MODEL_SHA256
        sync: false
      - key: SCAN_MODEL_URL_TOKEN
        sync: false
