version: 1

integration:
  target_branch: develop
  remote: origin
  protected_branches:
    - main
    - staging
  require_source_on_remote: true
  allow_agents:
    - integrator
    - lead

claims:
  lease_minutes: 20

amendments:
  tier2_requires_role: lead

verification:
  profiles:
    docs:
      resource_class: light
      commands:
        - pnpm lint
    unit:
      resource_class: moderate
      commands:
        - pnpm typecheck
        - pnpm lint
        - pnpm test
    full:
      resource_class: heavy
      commands:
        - pnpm check
    ui:
      resource_class: heavy
      commands:
        - pnpm check
        - pnpm check:ui

resources:
  classes:
    - light
    - moderate
    - heavy
  exclusive:
    - heavy

database:
  tool: supabase
  dev_project_ref: null
  production_project_refs:
    - egfwfyznbndunqfqzxjx
  env_file: .env.local
  migrate_command: null
  verify_command: null
  lease_minutes: 30
  resource_class: moderate

deployment:
  provider: vercel
  allowed_branches:
    - main
    - staging
  production_branch: main
  excluded_branches:
    - develop
  sensitive_paths:
    - vercel.json
    - render.yaml
    - next.config.ts
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - .github/workflows/**
    - supabase/migrations/**
    - src/**
    - public/**
  project_note: "Matches vercel.json: main and staging deploy, develop does not. agentctl releases up to 1.6.0 reject this allowlist in plan validate; 1.7.0 reads it from here."

cleanup:
  require_apply_flag: true
