name: "Complaint: handicap index"
description: A player says their index, playing handicap or class is wrong.
title: "complaint(index): "
labels: ["complaint", "complaint:index"]
body:
  - type: markdown
    attributes:
      value: "While this repository is public, write the pair number or player ID only. No names, no contact details."
  - type: input
    id: who
    attributes:
      label: Player or pair reference
      description: Pair number or player ID.
    validations:
      required: true
  - type: input
    id: when
    attributes:
      label: Day and session
      placeholder: "Day 3 AM"
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: What is claimed
      description: The index the system shows and the index the player says is right.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: The club sheet, the NGAP record or the card. Say where it can be seen.
  - type: dropdown
    id: state
    attributes:
      label: Already changed in the system?
      options:
        - "No, waiting for a decision"
        - "Yes, changed first and to be checked here"
    validations:
      required: true
