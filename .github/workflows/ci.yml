name: CI

# The four checks AGENTS.md asks for before every commit, plus the browser pass that found the bugs
# the other four could not see: an alerts panel whose text was ivory on ivory, and a list that sent
# the desk back to page 2 when a search was cleared. Both passed typecheck, lint, test and build.
#
# Both jobs call the same commands a person or an agent runs locally: `pnpm check` and `pnpm check:ui`.
# Keep it that way, so a local pass and a CI pass cannot drift apart.
#
# Deployment is separate: Vercel only auto-deploys `staging` and `main`, because vercel.json disables
# every other branch, `develop` included. The deploy-policy step below keeps that rule from being
# loosened by accident.
on:
  pull_request:
    branches: [develop, main, staging]
  push:
    branches: [develop, main, staging]

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version is pinned in package.json, so these steps pin it instead. Keep them in step with
      # the versions in the README's setup section.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Throttling control: preview builds for every branch burned minutes. Vercel reads this map
      # from the branch being built, so the rule lives in the repo next to the code it protects.
      - name: Deploy policy
        run: |
          node <<'NODE'
          const d = require("./vercel.json")?.git?.deploymentEnabled ?? {};
          const ok = d.staging === true && d.main === true && d.develop === false && d["*"] === false && d["**"] === false;
          if (!ok) {
            console.error("vercel.json must allow only staging and main to auto-deploy");
            process.exit(1);
          }
          console.log("deploy policy: staging and main only");
          NODE

      - name: Install
        run: pnpm install --frozen-lockfile

      # Typecheck, lint, unit tests, build, in that order, stopping at the first failure.
      - name: Check
        run: pnpm check

  ops:
    name: workspace app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The workspace app is its own Vercel project, so it carries the same rule: only staging and
      # main may auto-deploy.
      - name: Deploy policy (ops)
        run: |
          node <<'NODE'
          const d = require("./apps/ops/vercel.json")?.git?.deploymentEnabled ?? {};
          const ok = d.staging === true && d.main === true && d["*"] === false && d["**"] === false;
          if (!ok) {
            console.error("apps/ops/vercel.json must allow only staging and main to auto-deploy");
            process.exit(1);
          }
          console.log("deploy policy: apps/ops staging and main only");
          NODE

      - name: Install
        run: pnpm install --frozen-lockfile

      # Typecheck, lint, unit tests, the RLS check and the build, in that order.
      - name: Check
        run: pnpm --filter @teeline/ops check

  browser:
    name: browser checks
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Only what Chromium needs; the full playwright install would pull browsers this never uses.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # With no Supabase URL in the environment the app runs on the demo seed, which is what
      # scripts/verify-ui.mjs expects. `pnpm check:ui` starts a real dev server, waits for it, runs
      # the browser checks and stops it, so it is not part of `pnpm test`.
      - name: Browser checks
        run: pnpm check:ui

      - name: Dev server log when it fails
        if: failure()
        run: tail -100 .tmp/dev-server.log || true

  api:
    name: API regulation (warn)
    runs-on: ubuntu-latest
    needs: checks
    # API_REGULATION.md §11.3: warn mode for the rollout. The page suite is measured in demo mode;
    # the version endpoint is only certified when a connected Supabase environment is available.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: API check
        run: pnpm api:check

      - name: API dev server log when it fails
        if: failure()
        run: tail -100 .tmp/api-dev-server.log || true
